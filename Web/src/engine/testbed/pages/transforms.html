<h1>transforms test</h1>
<script>
// Phase 7 ground-truth page: EVERY Phase-3 transform variant and sink
// type, plus two benign controls. Ground truth lives in
// testbed/ground_truth.py — constants below must match it.
const SINK = "__SINK_BASE__";

// identifiers (stored in IDB → expected exfil)
const TID  = "tid-0f3e2d1c4b5a69788796a5b4c3d2e1f0";
const TENC = "id with spaces+plus/slash?chars=and&more 1234567890";
// benign controls (stored in IDB but NOT tracking identifiers)
const CSRF   = "csrf-11223344556677889900aabbccddeeff";
const VERSION = "v1.2.3-build.987654321";
// localStorage identifier → beacon (taint source)
const LSBEACON = "lsbeacon-99887766554433221100ffeeddccbbaa";

function urlenc(s) {
  return encodeURIComponent(s);
}
function b64(s) { return btoa(s); }
function hexutf8(s) {
  const b = new TextEncoder().encode(s);
  return Array.from(b).map((x) => x.toString(16).padStart(2, "0")).join("");
}
async function sha(s) {
  const buf = await crypto.subtle.digest("SHA-256",
    new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf))
    .map((b) => b.toString(16).padStart(2, "0")).join("");
}
// md5: RFC1321 pure-JS (block-boundary + unicode verified against
// hashlib via node before landing; see evaluate.py startup check)
function md5(str) {
  function add32(a, b) { return (a + b) & 0xFFFFFFFF; }
  function rol(n, c) { return (n << c) | (n >>> (32 - c)); }
  function cmn(q, a, b, x, s, t) { return add32(rol(add32(add32(a, q), add32(x, t)), s), b); }
  function ff(a,b,c,d,x,s,t){ return cmn((b & c) | ((~b) & d), a, b, x, s, t); }
  function gg(a,b,c,d,x,s,t){ return cmn((b & d) | (c & (~d)), a, b, x, s, t); }
  function hh(a,b,c,d,x,s,t){ return cmn(b ^ c ^ d, a, b, x, s, t); }
  function ii(a,b,c,d,x,s,t){ return cmn(c ^ (b | (~d)), a, b, x, s, t); }
  function md5cycle(x, k) {
    var a=x[0],b=x[1],c=x[2],d=x[3];
    a=ff(a,b,c,d,k[0],7,-680876936);   d=ff(d,a,b,c,k[1],12,-389564586);
    c=ff(c,d,a,b,k[2],17,606105819);    b=ff(b,c,d,a,k[3],22,-1044525330);
    a=ff(a,b,c,d,k[4],7,-176418897);    d=ff(d,a,b,c,k[5],12,1200080426);
    c=ff(c,d,a,b,k[6],17,-1473231341);  b=ff(b,c,d,a,k[7],22,-45705983);
    a=ff(a,b,c,d,k[8],7,1770035416);    d=ff(d,a,b,c,k[9],12,-1958414417);
    c=ff(c,d,a,b,k[10],17,-42063);      b=ff(b,c,d,a,k[11],22,-1990404162);
    a=ff(a,b,c,d,k[12],7,1804603682);   d=ff(d,a,b,c,k[13],12,-40341101);
    c=ff(c,d,a,b,k[14],17,-1502002290); b=ff(b,c,d,a,k[15],22,1236535329);
    a=gg(a,b,c,d,k[1],5,-165796510);    d=gg(d,a,b,c,k[6],9,-1069501632);
    c=gg(c,d,a,b,k[11],14,643717713);   b=gg(b,c,d,a,k[0],20,-373897302);
    a=gg(a,b,c,d,k[5],5,-701558691);    d=gg(d,a,b,c,k[10],9,38016083);
    c=gg(c,d,a,b,k[15],14,-660478335);  b=gg(b,c,d,a,k[4],20,-405537848);
    a=gg(a,b,c,d,k[9],5,568446438);     d=gg(d,a,b,c,k[14],9,-1019803690);
    c=gg(c,d,a,b,k[3],14,-187363961);   b=gg(b,c,d,a,k[8],20,1163531501);
    a=gg(a,b,c,d,k[13],5,-1444681467);  d=gg(d,a,b,c,k[2],9,-51403784);
    c=gg(c,d,a,b,k[7],14,1735328473);   b=gg(b,c,d,a,k[12],20,-1926607734);
    a=hh(a,b,c,d,k[5],4,-378558);       d=hh(d,a,b,c,k[8],11,-2022574463);
    c=hh(c,d,a,b,k[11],16,1839030562);  b=hh(b,c,d,a,k[14],23,-35309556);
    a=hh(a,b,c,d,k[1],4,-1530992060);   d=hh(d,a,b,c,k[4],11,1272893353);
    c=hh(c,d,a,b,k[7],16,-155497632);   b=hh(b,c,d,a,k[10],23,-1094730640);
    a=hh(a,b,c,d,k[13],4,681279174);    d=hh(d,a,b,c,k[0],11,-358537222);
    c=hh(c,d,a,b,k[3],16,-722521979);   b=hh(b,c,d,a,k[6],23,76029189);
    a=hh(a,b,c,d,k[9],4,-640364487);    d=hh(d,a,b,c,k[12],11,-421815835);
    c=hh(c,d,a,b,k[15],16,530742520);   b=hh(b,c,d,a,k[2],23,-995338651);
    a=ii(a,b,c,d,k[0],6,-198630844);    d=ii(d,a,b,c,k[7],10,1126891415);
    c=ii(c,d,a,b,k[14],15,-1416354905); b=ii(b,c,d,a,k[5],21,-57434055);
    a=ii(a,b,c,d,k[12],6,1700485571);   d=ii(d,a,b,c,k[3],10,-1894986606);
    c=ii(c,d,a,b,k[10],15,-1051523);    b=ii(b,c,d,a,k[1],21,-2054922799);
    a=ii(a,b,c,d,k[8],6,1873313359);    d=ii(d,a,b,c,k[15],10,-30611744);
    c=ii(c,d,a,b,k[6],15,-1560198380);  b=ii(b,c,d,a,k[13],21,1309151649);
    a=ii(a,b,c,d,k[4],6,-145523070);    d=ii(d,a,b,c,k[11],10,-1120210379);
    c=ii(c,d,a,b,k[2],15,718787259);    b=ii(b,c,d,a,k[9],21,-343485551);
    x[0]=add32(a,x[0]); x[1]=add32(b,x[1]); x[2]=add32(c,x[2]); x[3]=add32(d,x[3]);
  }
  // utf-8 encode
  var s = unescape(encodeURIComponent(str));
  var byteLen = s.length;
  var nBlocks = Math.floor((byteLen + 8) / 64) + 1;
  var totalBytes = nBlocks * 64;
  var buf = new Array(totalBytes);
  for (var b = 0; b < totalBytes; b++) buf[b] = 0;
  for (var i = 0; i < byteLen; i++) buf[i] = s.charCodeAt(i) & 0xFF;
  buf[byteLen] = 0x80;
  var bitLen = byteLen * 8;
  buf[totalBytes - 8] = bitLen & 0xFF;
  buf[totalBytes - 7] = (bitLen >>> 8) & 0xFF;
  buf[totalBytes - 6] = (bitLen >>> 16) & 0xFF;
  buf[totalBytes - 5] = (bitLen >>> 24) & 0xFF;
  var state = [1732584193, -271733879, -1732584194, 271733878];
  for (b = 0; b < totalBytes; b += 64) {
    var k = [];
    for (var w = 0; w < 16; w++) {
      var o = b + w * 4;
      k[w] = buf[o] | (buf[o+1] << 8) | (buf[o+2] << 16) | (buf[o+3] << 24);
    }
    md5cycle(state, k);
  }
  var hex = "0123456789abcdef", out = "";
  for (i = 0; i < 4; i++)
    for (var j = 0; j < 4; j++)
      out += hex.charAt((state[i] >> (j * 8 + 4)) & 0x0F) +
             hex.charAt((state[i] >> (j * 8)) & 0x0F);
  return out;
}

function writeIDB(pairs) {
  return new Promise((resolve) => {
    const req = indexedDB.open("tf_db", 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("ids")) db.createObjectStore("ids");
    };
    req.onsuccess = (e) => {
      const db = e.target.result;
      const tx = db.transaction("ids", "readwrite");
      const st = tx.objectStore("ids");
      for (const [k, v] of pairs) st.put(v, k);
      tx.oncomplete = () => resolve(db);
      tx.onerror = () => resolve(null);
    };
    req.onerror = () => resolve(null);
  });
}
function readIDB(db, key) {
  return new Promise((resolve) => {
    if (!db) return resolve(null);
    try {
      const tx = db.transaction("ids", "readonly");
      const g = tx.objectStore("ids").get(key);
      g.onsuccess = () => resolve(g.result);
      g.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

async function run() {
  const db = await writeIDB([["tid", TID], ["tenc", TENC],
                             ["csrf", CSRF], ["version", VERSION],
                             // volatile: changes every visit → makes the
                             // legacy changed-records filter activate on
                             // multi-iteration crawls (Phase 7 ablation)
                             ["volatile", String(Date.now())]]);
  const tid = await readIDB(db, "tid");
  const tenc = await readIDB(db, "tenc");
  const csrf = await readIDB(db, "csrf");
  const version = await readIDB(db, "version");

  // ── transform variants of TID → third-party sink ──
  try { fetch(`${SINK}/v/raw?x=${tid}`); } catch (e) {}
  try { fetch(`${SINK}/v/b64?x=${b64(tid)}`); } catch (e) {}
  try { fetch(`${SINK}/v/hex?x=${hexutf8(tid)}`); } catch (e) {}
  try { fetch(`${SINK}/v/md5?x=${md5(tid)}`); } catch (e) {}
  try { fetch(`${SINK}/v/sha1x?x=` + tid.slice(0, 16)); } catch (e) {}
  try {
    const h = await sha(tid);
    fetch(`${SINK}/v/sha256?x=${h}`);
  } catch (e) {}
  // urlencoded TENC (spaces + + / ? & = force real encoding)
  try { fetch(`${SINK}/v/enc?x=${urlenc(tenc)}`); } catch (e) {}

  // ── sink diversity on raw TID ──
  try {
    const x = new XMLHttpRequest();
    x.open("POST", `${SINK}/v/xhr`);
    x.setRequestHeader("Content-Type", "application/json");
    x.send(JSON.stringify({ d: tid }));
  } catch (e) {}
  try { navigator.sendBeacon(`${SINK}/v/beacon`, tid); } catch (e) {}
  try { (new Image()).src = `${SINK}/v/pixel?u=${tid}`; } catch (e) {}
  try {
    fetch(`${SINK}/v/form`, {method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: "d=" + encodeURIComponent(tid)});
  } catch (e) {}

  // ── benign controls ──
  // CSRF → SAME ORIGIN (1P event expected: must stay LOW confidence)
  try { fetch(`/v/csrf?token=${csrf}`); } catch (e) {}
  // version hash → third party CDN-like sink (GT: non-identifier → any
  // event on it counts as a false positive of the length gate)
  try { fetch(`${SINK}/v/cdn?v=${encodeURIComponent(version)}`); } catch (e) {}

  // ── localStorage identifier → sendBeacon (taint source → sink) ──
  try {
    localStorage.setItem("beacon_ls", LSBEACON);
    navigator.sendBeacon(`${SINK}/v/lsbeacon?d=`
      + encodeURIComponent(localStorage.getItem("beacon_ls")));
  } catch (e) {}

  document.title = "tf-done";
}
run();
</script>
